<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Export Radar">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="description" content="eBay で売れている日本の品物と、楽天・Yahoo!ショッピングの仕入れ値を毎日比べる">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>EXPORT RADAR SYSTEM</title>
</head>
<body>
<header class="top">
  <div class="top-row">
    <h1>EXPORT RADAR<span>SYSTEM</span></h1>
    <p class="meta" id="meta">読み込み中…</p>
    <button class="icon-btn" id="reload" aria-label="データを再読み込み">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>
  <div class="chips" id="genres" role="group" aria-label="ジャンル"></div>
</header>

<main id="view" aria-live="polite"></main>

<nav class="tabbar" role="tablist" aria-label="画面">
  <button role="tab" data-tab="profit" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 7.5 12 12l3.5-4.5M8 12.5h8M8 15.5h8M12 12v5.5"/></svg>
    利益候補
  </button>
  <button role="tab" data-tab="hot" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.3 1.6 1.2 2.6 2.3 2.6C11 8.500 11 5.5 12 3Z"/></svg>
    売れ筋
  </button>
  <button role="tab" data-tab="market" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4M4 20h16"/><path d="m7 15 4-4 3 3 5-6"/></svg>
    推移
  </button>
  <button role="tab" data-tab="settings" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
    設定
  </button>
</nav>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>

<script src="app.js"></script>
</body>
</html>
